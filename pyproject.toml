[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logiv-origin"
version = "0.1.0"
description = "Deployable LOGIV closed-loop robot control runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.22,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["external_repos"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pi05_libero_repro.logiv" = ["config/*.json", "config/*.pddl"]
